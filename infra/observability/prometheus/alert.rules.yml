groups:
  - name: churn_platform_alerts
    rules:
      # API Error Rate > 2% over 5m
      - alert: HighAPIErrorRate
        expr: |
          sum(rate(fastapi_requests_total{status_code=~"5.."}[5m])) 
          / 
          sum(rate(fastapi_requests_total[5m])) > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API Error Rate (> 2%)"
          description: "The API has been returning 5xx errors for more than 2% of requests over the last 5 minutes."

      # p95 Latency > 1s over 5m
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95, sum(rate(fastapi_requests_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API p95 Latency"
          description: "API 95th percentile latency is greater than 1s."

      # Background Job Queue Depth
      - alert: JobQueueDepthGrowing
        expr: arq_queued_jobs > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Job Queue Depth"
          description: "There are more than 100 queued background jobs."

      # LLM (Gemini) Call Failure Rate > 10%
      - alert: HighLLMFailureRate
        expr: |
          sum(rate(llm_calls_total{status="error"}[5m])) 
          / 
          sum(rate(llm_calls_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High LLM Failure Rate"
          description: "More than 10% of calls to Gemini have failed in the last 5 minutes."

      # DB connections > 80% of pool
      - alert: HighDBConnectionSaturation
        expr: |
          sqlalchemy_pool_checkedout / (sqlalchemy_pool_checkedout + sqlalchemy_pool_checkedin) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB Connection Pool Saturation"
          description: "Database connection pool usage is over 80%."
