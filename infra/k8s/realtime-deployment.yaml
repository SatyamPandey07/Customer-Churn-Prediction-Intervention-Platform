apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-realtime
  labels:
    app: churn-realtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-realtime
  template:
    metadata:
      labels:
        app: churn-realtime
    spec:
      containers:
      - name: realtime
        image: ghcr.io/churn-platform/realtime:latest
        ports:
        - containerPort: 3001
        env:
        - name: REDIS_URL
          value: "redis://churn-redis:6379/0"
        - name: FRONTEND_URL
          value: "https://app.churn-platform.com"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: churn-realtime
spec:
  type: ClusterIP
  selector:
    app: churn-realtime
  ports:
  - port: 3001
    targetPort: 3001
