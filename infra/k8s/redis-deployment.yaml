apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-redis
  labels:
    app: churn-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: churn-redis
  template:
    metadata:
      labels:
        app: churn-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: churn-redis
spec:
  type: ClusterIP
  selector:
    app: churn-redis
  ports:
  - port: 6379
    targetPort: 6379
