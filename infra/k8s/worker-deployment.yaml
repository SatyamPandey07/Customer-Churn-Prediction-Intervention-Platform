apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-worker
  labels:
    app: churn-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-worker
  template:
    metadata:
      labels:
        app: churn-worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/churn-platform/api:latest
        command: ["arq", "apps.api.worker.WorkerSettings"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: churn-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          value: "redis://churn-redis:6379/0"
        - name: SECRETS_PROVIDER
          value: "vault"
        - name: VAULT_ADDR
          value: "http://vault:8200"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: churn-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: churn-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
