name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: cd apps/api && uv venv && source .venv/bin/activate && uv pip install -e .[dev]
      - name: Lint API (ruff)
        run: cd apps/api && source .venv/bin/activate && ruff check .
      - name: Test API
        run: cd apps/api && source .venv/bin/activate && pytest
      - name: Validate Docker Compose
        run: docker compose config

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Python Dependency Audit
        run: cd apps/api && pip-audit || true # Allow failure initially for demo
      - name: Node Dependency Audit
        run: cd apps/web && npm audit || true # Allow failure initially for demo
      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/churn-platform/api:latest'
          format: 'table'
          exit-code: '0' # Don't fail build yet
          ignore-unfixed: true

  build-and-push:
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ghcr.io/churn-platform/api:latest
      # Add web and realtime build steps here similarly

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.churn-platform.com
    # This environment should require manual approval in GitHub repo settings
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes
        run: |
          echo "Applying k8s manifests..."
          # kubectl apply -f infra/k8s/
