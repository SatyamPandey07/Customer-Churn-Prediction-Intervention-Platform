name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: cd apps/api && uv venv && source .venv/bin/activate && uv pip install -e .[dev]
      - name: Lint API (ruff)
        run: cd apps/api && source .venv/bin/activate && ruff check .
      - name: Test API
        run: cd apps/api && source .venv/bin/activate && pytest
      - name: Validate Docker Compose
        run: docker compose config
